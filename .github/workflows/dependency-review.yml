# Scans dependency manifest changes in a pull request for known-vulnerable versions.
# Source repository: https://github.com/actions/dependency-review-action
name: 'Dependency Review'
on: [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    uses: devops-actions/.github/.github/workflows/dependency-review.yml@f2b5c26c77264c245360c3f1f2d279947cc86503 # v1.2.0
    permissions:
      contents: read
      pull-requests: write
