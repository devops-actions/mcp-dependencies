# Scans dependency manifest changes in a pull request for known-vulnerable versions.
# Source repository: https://github.com/actions/dependency-review-action
name: 'Dependency Review'
on: [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    uses: devops-actions/.github/.github/workflows/dependency-review.yml@main
    permissions:
      contents: read
      pull-requests: write
