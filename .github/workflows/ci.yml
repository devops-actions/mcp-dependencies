name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test --workspace packages/core

  mcpsense-scan:
    name: MCPSense Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      security-events: write  # for SARIF upload to GitHub Code Scanning
    steps:
      - uses: actions/checkout@v4

      - name: Run MCPSense security scan
        uses: fayzkk889/MCPSense@v0.3.0
        with:
          target: "."
          mode: "static"
          format: "sarif"
          sarif-upload: "true"
          fail-on: "critical"
          severity: "low"
