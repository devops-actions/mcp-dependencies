version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      npm:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # typescript-eslint v8 only supports typescript <6.1. Remove once it supports newer versions.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
